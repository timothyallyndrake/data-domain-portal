name: ci

on:
  pull_request:
    branches: [development, production]
  push:
    branches: [development, production]
  workflow_dispatch:

jobs:
  web-lint-typecheck:
    name: Web • ESLint + TypeScript + Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Verify pnpm
        run: |
          echo "PATH=$PATH"
          which pnpm || true
          pnpm --version || true

      - name: Install JS deps
        run: pnpm install --frozen-lockfile=false

      - name: ESLint (fail on warnings)
        run: pnpm exec eslint "apps/web/src/**/*.{ts,tsx}" --max-warnings 0

      - name: TypeScript typecheck
        run: pnpm exec tsc -p apps/web/tsconfig.app.json --noEmit

      - name: Prettier check
        run: pnpm exec prettier --check "**/*.{md,json,yml,yaml,ts,tsx,js,css}"

  py-lint-test:
    name: Python • Ruff + Black + Pytest (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          cd apps/api && poetry install

      - name: Ruff (lint)
        run: cd apps/api && poetry run ruff check .

      - name: Black (format check)
        run: cd apps/api && poetry run black --check .

      - name: Pytest (api)
        run: cd apps/api && poetry run pytest -q
