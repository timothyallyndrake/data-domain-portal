name: ci

on:
  pull_request:
    branches: [development, production]
  push:
    branches: [development, production]
  workflow_dispatch:

jobs:
  web-lint-typecheck:
    name: Web • ESLint + TypeScript + Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install JS deps
        run: pnpm install --frozen-lockfile=false

      - name: ESLint (fail on warnings)
        run: pnpm exec eslint "apps/web/src/**/*.{ts,tsx}" --max-warnings 0

      - name: TypeScript typecheck
        run: pnpm exec tsc -p apps/web/tsconfig.app.json --noEmit

      - name: Prettier check
        run: pnpm exec prettier --check "**/*.{md,json,yml,yaml,ts,tsx,js,css}"

  py-lint-test:
    name: Python • Ruff + Black + Pytest (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters & api deps
        run: |
          python -m pip install --upgrade pip
          pip install \
            ruff==0.6.9 black==24.8.0 pytest==8.3.2 httpx==0.27.2 \
            fastapi[all]==0.115.0 uvicorn[standard]==0.30.6 \
            pydantic==2.9.2 pydantic-settings==2.6.1 \
            sqlalchemy[asyncio]==2.0.35 asyncpg==0.29.0 alembic==1.13.2 \
            redis==5.0.8 aiokafka==0.10.0 python-jose[cryptography]==3.3.0 \
            casbin==1.36.0 structlog==24.4.0

      - name: Ruff (lint)
        run: ruff check apps/api

      - name: Black (format check)
        run: black --check apps/api

      - name: Pytest (api)
        working-directory: apps/api
        run: pytest -q
