name: ci

on:
  pull_request:
    branches: [development, production]
  push:
    branches: [development, production]
  workflow_dispatch:

jobs:
  web-lint-typecheck:
    name: Web • ESLint + TypeScript + Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version

      - name: Install JS deps
        run: pnpm install --frozen-lockfile=false

      - name: ESLint (fail on warnings)
        run: npx eslint "apps/web/src/**/*.{ts,tsx}" --max-warnings 0

      - name: TypeScript typecheck
        run: npx tsc -p apps/web/tsconfig.app.json --noEmit

      - name: Prettier check
        run: npx prettier --check "**/*.{md,json,yml,yaml,ts,tsx,js,css}"

  py-lint-test:
    name: Python • Ruff + Black + Pytest (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters & test deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9 black==24.8.0 pytest==8.3.2 httpx==0.27.2
          # install API package deps (editable); worker later when tests added
          pip install -e apps/api

      - name: Ruff (lint)
        run: ruff check apps/api

      - name: Black (format check)
        run: black --check apps/api

      - name: Pytest (api)
        working-directory: apps/api
        run: pytest -q
