[project]
name = "server"
version = "0.1.0"
description = "The FastAPI backend for the Data Domain Portal."
readme = "README.md"
requires-python = ">=3.11,<4"

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy",
  "alembic",
  "snowflake-sqlalchemy",
  "snowflake-connector-python",
  "pydantic-settings",
  "redis[hiredis]",
  "python-jose[cryptography]",
  "passlib[bcrypt]",
  "python-multipart",
  "email-validator",
  "click",
]

[project.optional-dependencies]
dev = [
  "autopep8",
  "ruff",
  "pytest",
  "pytest-sugar",
  "pytest-cov",
  "pytest-html",
  "pytest-mock",
  "httpx",

  # TODO: Revisit this list after `uv` or its Nx integration is updated.
  # The `uv run` command is currently failing to resolve the full dependency
  # tree for pytest, requiring these sub-dependencies to be listed explicitly.
  "pluggy",
  "pygments",
  "iniconfig",
  "pytest-metadata",
  "jinja2",
  "termcolor",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
