[project]
name = "server"
version = "0.1.0"
description = "The FastAPI backend for the Data Domain Portal."
readme = "README.md"
requires-python = ">=3.11,<4"

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy",
  "alembic",
  "snowflake-sqlalchemy",
  "snowflake-connector-python[async]",
  "pydantic-settings",
  "redis[hiredis]",
  "python-jose[cryptography]",
  "passlib[bcrypt]",
  "python-multipart",
  "email-validator",
  "click",
]

[project.optional-dependencies]
dev = [
  "autopep8",
  "ruff",
  "pytest",
  "pytest-sugar",
  "pytest-cov",
  "pytest-html",
  "pytest-mock",
  "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
